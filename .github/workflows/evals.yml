name: Evals

# RBAC red-team and answer-quality evaluation against a freshly built index.
# Heavier than CI (downloads models, builds the index, calls Groq), so it runs
# nightly, on demand, and on pull requests that touch the pipeline or the data.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "evaluation/**"
      - "resources/**"
      - "requirements*.txt"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Empty on pull requests from forks: the LLM-backed steps are then skipped.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-eval.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/utils/embeddings.py', 'app/config.py') }}

      - name: Build the index
        run: python -m app.ingest

      # Always runs, needs no API key: no role may retrieve another department's data.
      - name: RBAC red-team (retrieval and reranker)
        run: python evaluation/redteam.py

      - name: RBAC red-team (full pipeline with LLM)
        if: env.GROQ_API_KEY != ''
        run: python evaluation/redteam.py --llm

      - name: Answer quality (RAGAS)
        if: env.GROQ_API_KEY != ''
        run: python evaluation/evaluate_answers.py --check --ragas-limit 12

      - name: Publish results
        if: always()
        run: |
          {
            echo "## Eval results"
            for f in evaluation/redteam_results.json evaluation/answer_results.json; do
              if [ -f "$f" ]; then echo "- \`$f\` attached as an artifact"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evaluation/redteam_results.json
            evaluation/answer_results.json
          if-no-files-found: ignore
