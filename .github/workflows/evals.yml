name: Evals

# RBAC red-team and answer-quality evaluation against a freshly built index.
# Heavier than CI (downloads models, builds the index, calls the Anthropic API), so it runs
# nightly, on demand, and on pull requests that touch the pipeline or the data.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "evaluation/**"
      - "resources/**"
      - "requirements*.txt"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Pull requests from forks get no secrets, so the LLM-backed steps are skipped for them
      # (and the job summary says so). For everything else they always run: a missing or
      # rejected Anthropic key fails the run, it is never a pass.
      IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-eval.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/utils/embeddings.py', 'app/config.py') }}

      - name: Build the index
        run: python -m app.ingest

      # No API key needed: retrieval quality must stay above evaluation/retrieval_thresholds.json
      # (Recall, MRR and the rank of known near-tie queries) with zero RBAC leaks.
      - name: Retrieval evaluation
        run: python evaluation/evaluate_retrieval.py --check

      # Always runs, needs no API key: no role may retrieve another department's data.
      - name: RBAC red-team (retrieval and reranker)
        run: python evaluation/redteam.py

      # The chatbot runs on Anthropic here (LLM_PROVIDER=anthropic, Claude Haiku), so the Evals
      # workflow does not use Groq at all and cannot run out of Groq's free-tier quota. The key is
      # passed to the two LLM-backed steps only, so pip and the other steps never see it. Production
      # keeps its own provider setting (Groq by default).
      - name: RBAC red-team (full pipeline with LLM)
        if: env.IS_FORK_PR != 'true'
        env:
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python evaluation/redteam.py --llm

      # Generator, red-team target and RAGAS judge are all Claude Haiku via the Anthropic API.
      # Every answerable question is judged (no --ragas-limit): a 12-sample subset was too noisy to gate on.
      # The script exits non-zero before generating anything if the key is missing or rejected.
      - name: Answer quality (RAGAS, Claude Haiku judge)
        if: env.IS_FORK_PR != 'true'
        env:
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python evaluation/evaluate_answers.py --check

      - name: Publish results
        if: always()
        run: |
          {
            echo "## Eval results"
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "> **LLM-backed steps were skipped:** this pull request comes from a fork, which gets no secrets."
            fi
            for f in evaluation/redteam_results.json evaluation/answer_results.json; do
              if [ -f "$f" ]; then echo "- \`$f\` attached as an artifact"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evaluation/redteam_results.json
            evaluation/answer_results.json
          if-no-files-found: ignore
